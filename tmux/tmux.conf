set-option -sa terminal-overrides ",xterm*:Tc"

# set -g default-shell /usr/local/bin/bash
# set -g default-terminal screen-256color

set -g history-limit 10000
set -g mouse on
set -g pane-border-format '#[bold]#{pane_title}#[default]'
set -g pane-border-status top
set -g prefix C-z
set -g remain-on-exit on
set -g renumber-windows on
set -g status-interval 1
set -g status-keys emacs
set -g status-right "%T (%s)"
set -g synchronize-panes off
set -g update-environment "SSH_AUTH_SOCK \
                           SSH_CONNECTION \
                           DISPLAY"
set -g window-status-current-style 'bg=colour208,fg=black,bold'

bind-key -r M-Left swap-window -d -t -1
bind-key -r M-Right swap-window -d -t +1

# bind , command-prompt -p "(rename-window '#W')" "rename-window '%%'"
# bind '$' command-prompt -p "(rename-session '#S')" "rename-session '%%'"

# bind R                                      \
#     set -g renumber-windows on\;            \
#     new-window\; kill-window\;              \
#     set -g renumber-windows off\;           \
#     display-message "Windows reordered..."

bind-key C source-file ~/.config/tmux/tmux.conf
bind-key E new-window emacsclient -t
bind-key H split-window -v htop -tu $LOGNAME \; swap-pane -dU
bind-key N command-prompt -p "ssh to host?" "new-window -n %1 '/usr/bin/ssh %1'"
bind-key S command-prompt -p "ssh to host?" "split-window '/usr/bin/ssh %1'"

# Open panes in current working directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Toggle synchronize-panes, with a status confirmation
bind-key Y set-window-option synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,ON,off}"

### COPY AND PASTE
set -g copy-command clipboard-copy

# Forward OSC 52 clipboard-set escapes (e.g. from terminal Emacs) out to the
# outermost terminal, so a copy made inside tmux reaches the real system
# clipboard even across SSH.
set -g set-clipboard on

