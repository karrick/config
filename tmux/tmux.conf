bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode M-w send-keys -X copy-pipe
set -g mouse on

unbind C-b

# Machine-local key-bindings (e.g. host ssh/mtsh shortcuts) live in
# tmux-local.conf, populated by config management; -q silently skips it when
# the file is absent.
source-file -q ~/.config/tmux/tmux-local.conf
